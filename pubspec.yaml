name: master_admin
description: "SCJ Member Database"
publish_to: 'none'
version: 1.0.0+1

environment:
  # This tells Flutter to work with YOUR current Dart 3.1.x
  sdk: '>=3.0.0 <4.0.0' 

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: 
    sdk: flutter
  
  # UI & Charts
  fl_chart: ^1.2.0
  google_fonts: ^8.1.0
  font_awesome_flutter: ^11.0.0
  cupertino_icons: ^1.0.8
  
  # Calendar & Backend
  table_calendar: ^3.1.2
  intl: ^0.20.2
  supabase_flutter: ^2.12.0
  
  # Documents & Sheets (Using the version your terminal recommended)
  pluto_grid: ^8.1.0
  flutter_quill: ^11.0.2 # Using v10 because v11 requires a newer Flutter engine
  flutter_quill_extensions: ^11.0.0

  # Utilities
  csv: ^6.0.0
  path_provider: ^2.1.6
  share_plus: ^12.0.2
  cached_network_image: ^3.4.1
  youtube_player_flutter: ^10.0.1
  file_picker: ^8.0.0
  shared_preferences: ^2.5.5
  excel: ^4.0.6
  pdf: ^3.12.0
  printing: ^5.14.3
  crypto: ^3.0.7
  video_player: ^2.9.2      # Media Hub player (audio + video, web and mobile)
  url_launcher: ^6.3.1      # open chat attachments
  record: ^6.0.0            # My Home voice notes
  camera: ^0.11.1           # My Home round video messages
  geolocator: ^14.0.0       # My Home location sharing
  device_info_plus: '>=11.0.0 <13.0.0'  # Settings › Devices (device name)
  qr_flutter: ^4.1.0        # Settings › Two-step verification QR code
  http: ^1.2.2              # Settings › Devices (approximate place)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/

dependency_overrides:
  intl: ^0.20.2
